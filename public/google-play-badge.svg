<svg xmlns="http://www.w3.org/2000/svg" width="160" height="53" viewBox="0 0 160 53">
  <rect width="160" height="53" rx="8" fill="#000"/>
  <!-- Google Play logo (4-color play button) -->
  <g transform="translate(12, 9)">
    <!-- Green: bottom-left -->
    <path d="M1 32.2L17.6 17.7 1 3.1V32.2z" fill="url(#gp_green)"/>
    <!-- Blue: top -->
    <path d="M1 3.1L17.6 17.7 23.4 12.3 4.8 1.6C3.3.8 2 .9 1 1.7V3.1z" fill="url(#gp_blue)"/>
    <!-- Yellow: bottom -->
    <path d="M1 32.2v1.4c1 .8 2.3.9 3.8.1l18.6-10.7L17.6 17.7 1 32.2z" fill="url(#gp_yellow)"/>
    <!-- Red: right -->
    <path d="M23.4 12.3L17.6 17.7l5.8 5.3 6.7-3.8c1.9-1.1 1.9-2.8 0-3.9L23.4 12.3z" fill="url(#gp_red)"/>
    <defs>
      <linearGradient id="gp_green" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00D45E"/>
        <stop offset="100%" stop-color="#00B147"/>
      </linearGradient>
      <linearGradient id="gp_blue" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#29C4F6"/>
        <stop offset="100%" stop-color="#0681BC"/>
      </linearGradient>
      <linearGradient id="gp_yellow" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFD000"/>
        <stop offset="100%" stop-color="#F99500"/>
      </linearGradient>
      <linearGradient id="gp_red" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF4359"/>
        <stop offset="100%" stop-color="#C8003B"/>
      </linearGradient>
    </defs>
  </g>
  <!-- Get it on -->
  <text x="54" y="22" fill="white" font-family="Roboto, -apple-system, Arial, sans-serif" font-size="10" letter-spacing="0.3">Get it on</text>
  <!-- Google Play -->
  <text x="53" y="40" fill="white" font-family="Roboto, -apple-system, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="-0.2">Google Play</text>
</svg>
